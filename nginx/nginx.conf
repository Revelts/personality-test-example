user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # ── juraganapart.id: Redirect HTTP → HTTPS ──────────────────────────────────
    server {
        listen 80;
        server_name juraganapart.id www.juraganapart.id;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://juraganapart.id$request_uri;
        }
    }

    # ── juraganapart.id: HTTPS ───────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name juraganapart.id www.juraganapart.id;

        ssl_certificate     /etc/letsencrypt/live/juraganapart.id/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/juraganapart.id/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/juraganapart.id/chain.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;

        # Security headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Redirect www → non-www
        if ($host = www.juraganapart.id) {
            return 301 https://juraganapart.id$request_uri;
        }

        # Next.js static assets — safe to cache forever (content-hashed filenames)
        location /_next/static/ {
            proxy_pass http://juragan_app:3000;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Cache-Status "STATIC" always;
        }

        # Public folder assets — short cache
        location /images/ {
            proxy_pass http://juragan_app:3000;
            add_header Cache-Control "public, max-age=86400" always;
        }

        location /fonts/ {
            proxy_pass http://juragan_app:3000;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # HTML pages — no-cache to break old Vercel CDN cache
        location / {
            proxy_pass http://juragan_app:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60s;
            proxy_connect_timeout 60s;

            # Strip any Vercel cache headers from upstream
            proxy_hide_header X-Vercel-Cache;
            proxy_hide_header X-Vercel-Id;
            proxy_hide_header X-Vercel-Deployment-Url;

            # Force browsers to always revalidate HTML
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }
    }

    # ── sandisktechshift.com: Redirect HTTP → HTTPS ──────────────────────────────
    server {
        listen 80;
        server_name sandisktechshift.com www.sandisktechshift.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://sandisktechshift.com$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl;
        http2 on;
        server_name sandisktechshift.com www.sandisktechshift.com;

        ssl_certificate     /etc/letsencrypt/live/sandisktechshift.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sandisktechshift.com/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/sandisktechshift.com/chain.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;

        # Security headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Redirect www → non-www
        if ($host = www.sandisktechshift.com) {
            return 301 https://sandisktechshift.com$request_uri;
        }

        # Next.js static assets — safe to cache forever (content-hashed filenames)
        location /_next/static/ {
            proxy_pass http://app:3000;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Cache-Status "STATIC" always;
        }

        # Public folder assets
        location /fonts/ {
            proxy_pass http://app:3000;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location /video/ {
            proxy_pass http://app:3000;
            add_header Cache-Control "public, max-age=86400" always;
        }

        # HTML pages — no-cache to break old Vercel CDN cache
        location / {
            proxy_pass http://app:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60s;
            proxy_connect_timeout 60s;

            # Strip any Vercel cache headers from upstream
            proxy_hide_header X-Vercel-Cache;
            proxy_hide_header X-Vercel-Id;
            proxy_hide_header X-Vercel-Deployment-Url;

            # Force browsers to always revalidate HTML
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }
    }
}
