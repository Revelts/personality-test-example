user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;         # Linux optimal I/O event model
    multi_accept on;   # Accept all pending connections at once
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging (includes cache status for every request) ────────────────────────
    log_format main '$remote_addr - [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    'cache=$upstream_cache_status ua="$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    # ── TCP / File I/O ───────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    keepalive_requests 1000;

    # ── Client limits ────────────────────────────────────────────────────────────
    client_max_body_size    10m;
    client_body_buffer_size 128k;

    # ── Gzip compression ─────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        application/atom+xml image/svg+xml
        application/x-font-ttf font/opentype;

    # ── Proxy cache zones ────────────────────────────────────────────────────────
    #
    # html_cache  — short-lived cache for HTML pages (60 s TTL).
    #   10m  keys zone  = holds ~80 000 cache keys in RAM
    #   500m max_size   = disk quota; evicts LRU when full
    #   5m   inactive   = evict entries not accessed for 5 min
    #
    proxy_cache_path /var/cache/nginx/html
        levels=1:2
        keys_zone=html_cache:10m
        max_size=500m
        inactive=5m
        use_temp_path=off;

    #
    # static_cache — long-lived cache for immutable assets (_next/static, fonts).
    #   10m  keys zone
    #   2g   max_size   = generous budget for JS/CSS bundles
    #   7d   inactive   = keep assets warm for a week
    #
    proxy_cache_path /var/cache/nginx/static
        levels=1:2
        keys_zone=static_cache:10m
        max_size=2g
        inactive=7d
        use_temp_path=off;

    # ── Cache bypass: skip nginx cache when any cookie is present ────────────────
    #
    # Frontend-only apps have no auth cookies today, so most traffic is cached.
    # If auth is added later (session/JWT cookies), those requests automatically
    # bypass the shared cache — no code change required.
    #
    map $http_cookie $cache_bypass {
        default  "";    # no cookie → serve from nginx cache
        ~.       "1";   # any cookie present → bypass to upstream
    }

    # ── Upstream pools with keepalive ────────────────────────────────────────────
    #
    # keepalive 32 = keep 32 idle connections open to each upstream.
    # Requires proxy_http_version 1.1 + proxy_set_header Connection "" in every
    # location that uses this upstream to actually reuse connections.
    #
    upstream sandisk_app {
        server app:3000;
        keepalive 32;
    }

    upstream juragan_app_pool {
        server juragan_app:3000;
        keepalive 32;
    }

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # juraganapart.id — HTTP → HTTPS redirect
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    server {
        listen 80;
        server_name juraganapart.id www.juraganapart.id;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://juraganapart.id$request_uri;
        }
    }

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # juraganapart.id — HTTPS
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    server {
        listen 443 ssl;
        http2 on;
        server_name juraganapart.id www.juraganapart.id;

        ssl_certificate          /etc/letsencrypt/live/juraganapart.id/fullchain.pem;
        ssl_certificate_key      /etc/letsencrypt/live/juraganapart.id/privkey.pem;
        ssl_trusted_certificate  /etc/letsencrypt/live/juraganapart.id/chain.pem;

        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_ciphers               'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       1d;
        ssl_session_tickets       off;
        ssl_stapling              on;
        ssl_stapling_verify       on;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;

        # NOTE: Security headers are defined per-location below.
        # nginx drops server-level add_header when a location has its own add_header,
        # so headers are repeated in every location to guarantee they are always sent.

        # www → non-www canonical redirect
        if ($host = www.juraganapart.id) {
            return 301 https://juraganapart.id$request_uri;
        }

        # ── _next/data — NEVER cache ─────────────────────────────────────────────
        location /_next/data/ {
            proxy_pass         http://juragan_app_pool;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header X-Content-Type-Options    nosniff always;
            add_header X-Frame-Options           SAMEORIGIN always;
            add_header Referrer-Policy           strict-origin-when-cross-origin always;
            add_header X-XSS-Protection          "1; mode=block" always;
            add_header X-Cache-Status            "BYPASS" always;
        }

        # ── _next/static — immutable assets, cache 1 year ───────────────────────
        location /_next/static/ {
            proxy_pass         http://juragan_app_pool;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;

            proxy_cache               static_cache;
            proxy_cache_key           "$host$request_uri";
            proxy_cache_valid         200 7d;
            proxy_cache_use_stale     error timeout updating;
            proxy_cache_lock          on;

            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header X-Content-Type-Options    nosniff always;
            add_header X-Frame-Options           SAMEORIGIN always;
            add_header Referrer-Policy           strict-origin-when-cross-origin always;
            add_header X-XSS-Protection          "1; mode=block" always;
            add_header Cache-Control             "public, max-age=31536000, immutable" always;
            add_header X-Cache-Status            $upstream_cache_status always;
        }

        # ── /fonts — immutable font files ────────────────────────────────────────
        location /fonts/ {
            proxy_pass         http://juragan_app_pool;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;

            proxy_cache               static_cache;
            proxy_cache_key           "$host$request_uri";
            proxy_cache_valid         200 7d;
            proxy_cache_use_stale     error timeout updating;
            proxy_cache_lock          on;

            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header X-Content-Type-Options    nosniff always;
            add_header X-Frame-Options           SAMEORIGIN always;
            add_header Referrer-Policy           strict-origin-when-cross-origin always;
            add_header X-XSS-Protection          "1; mode=block" always;
            add_header Cache-Control             "public, max-age=31536000, immutable" always;
            add_header X-Cache-Status            $upstream_cache_status always;
        }

        # ── /images — moderate cache ─────────────────────────────────────────────
        location /images/ {
            proxy_pass         http://juragan_app_pool;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;

            proxy_cache               static_cache;
            proxy_cache_key           "$host$request_uri";
            proxy_cache_valid         200 1d;
            proxy_cache_use_stale     error timeout updating;
            proxy_cache_lock          on;

            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header X-Content-Type-Options    nosniff always;
            add_header X-Frame-Options           SAMEORIGIN always;
            add_header Referrer-Policy           strict-origin-when-cross-origin always;
            add_header X-XSS-Protection          "1; mode=block" always;
            add_header Cache-Control             "public, max-age=86400" always;
            add_header X-Cache-Status            $upstream_cache_status always;
        }

        # ── HTML pages — 60 s nginx cache with background revalidation ───────────
        #
        # proxy_cache_background_update on
        #   → while a stale entry is being refreshed, nginx serves the old cached
        #     response to all incoming requests. Zero cold-cache latency spikes.
        #
        # proxy_cache_lock on
        #   → only ONE request goes upstream when cache is cold or expired.
        #     All concurrent requests wait then share the single response.
        #     Prevents thundering-herd at high concurrency.
        #
        # proxy_cache_bypass / proxy_no_cache $cache_bypass
        #   → if any cookie is present: skip cache entirely (both read and write).
        #
        location / {
            proxy_pass         http://juragan_app_pool;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout    60s;
            proxy_connect_timeout 10s;

            proxy_cache                   html_cache;
            proxy_cache_key               "$scheme$host$request_uri";
            proxy_cache_valid             200 301 302 60s;
            proxy_cache_valid             404 10s;
            proxy_cache_use_stale         error timeout invalid_header updating
                                          http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_lock              on;
            proxy_cache_lock_timeout      5s;
            proxy_cache_bypass            $cache_bypass;
            proxy_no_cache                $cache_bypass;

            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header X-Content-Type-Options    nosniff always;
            add_header X-Frame-Options           SAMEORIGIN always;
            add_header Referrer-Policy           strict-origin-when-cross-origin always;
            add_header X-XSS-Protection          "1; mode=block" always;
            add_header Cache-Control             "public, max-age=60, stale-while-revalidate=30" always;
            add_header X-Cache-Status            $upstream_cache_status always;
        }
    }

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # sandisktechshift.com — HTTP → HTTPS redirect
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    server {
        listen 80;
        server_name sandisktechshift.com www.sandisktechshift.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://sandisktechshift.com$request_uri;
        }
    }

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # sandisktechshift.com — HTTPS (main quiz + /techshiftchallenge landing page)
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    server {
        listen 443 ssl;
        http2 on;
        server_name sandisktechshift.com www.sandisktechshift.com;

        ssl_certificate          /etc/letsencrypt/live/sandisktechshift.com/fullchain.pem;
        ssl_certificate_key      /etc/letsencrypt/live/sandisktechshift.com/privkey.pem;
        ssl_trusted_certificate  /etc/letsencrypt/live/sandisktechshift.com/chain.pem;

        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_ciphers               'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       1d;
        ssl_session_tickets       off;
        ssl_stapling              on;
        ssl_stapling_verify       on;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;

        # NOTE: Security headers are defined per-location below (see juraganapart comment).

        # www → non-www canonical redirect
        if ($host = www.sandisktechshift.com) {
            return 301 https://sandisktechshift.com$request_uri;
        }

        # ── _next/data — NEVER cache ─────────────────────────────────────────────
        location /_next/data/ {
            proxy_pass         http://sandisk_app;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header X-Content-Type-Options    nosniff always;
            add_header X-Frame-Options           DENY always;
            add_header Referrer-Policy           strict-origin-when-cross-origin always;
            add_header X-XSS-Protection          "1; mode=block" always;
            add_header X-Cache-Status            "BYPASS" always;
        }

        # ── _next/static — immutable, content-hashed assets ──────────────────────
        location /_next/static/ {
            proxy_pass         http://sandisk_app;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;

            proxy_cache               static_cache;
            proxy_cache_key           "$host$request_uri";
            proxy_cache_valid         200 7d;
            proxy_cache_use_stale     error timeout updating;
            proxy_cache_lock          on;

            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header X-Content-Type-Options    nosniff always;
            add_header X-Frame-Options           DENY always;
            add_header Referrer-Policy           strict-origin-when-cross-origin always;
            add_header X-XSS-Protection          "1; mode=block" always;
            add_header Cache-Control             "public, max-age=31536000, immutable" always;
            add_header X-Cache-Status            $upstream_cache_status always;
        }

        # ── /fonts — Pilat Extended family, immutable ─────────────────────────────
        location /fonts/ {
            proxy_pass         http://sandisk_app;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;

            proxy_cache               static_cache;
            proxy_cache_key           "$host$request_uri";
            proxy_cache_valid         200 7d;
            proxy_cache_use_stale     error timeout updating;
            proxy_cache_lock          on;

            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header X-Content-Type-Options    nosniff always;
            add_header X-Frame-Options           DENY always;
            add_header Referrer-Policy           strict-origin-when-cross-origin always;
            add_header X-XSS-Protection          "1; mode=block" always;
            add_header Cache-Control             "public, max-age=31536000, immutable" always;
            add_header X-Cache-Status            $upstream_cache_status always;
        }

        # ── /video — large files, browser cache only (no nginx disk cache) ────────
        #
        # Caching multi-MB MP4 files in nginx would exhaust the static_cache budget.
        # proxy_buffering off streams bytes directly to the client without disk I/O.
        # Browser caches the file for 24 h after first load.
        #
        location /video/ {
            proxy_pass         http://sandisk_app;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_buffering    off;

            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header X-Content-Type-Options    nosniff always;
            add_header X-Frame-Options           DENY always;
            add_header Referrer-Policy           strict-origin-when-cross-origin always;
            add_header X-XSS-Protection          "1; mode=block" always;
            add_header Cache-Control             "public, max-age=86400" always;
            add_header X-Cache-Status            "STREAM" always;
        }

        # ── HTML pages (quiz + /techshiftchallenge) ───────────────────────────────
        location / {
            proxy_pass         http://sandisk_app;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout    60s;
            proxy_connect_timeout 10s;

            proxy_cache                   html_cache;
            proxy_cache_key               "$scheme$host$request_uri";
            proxy_cache_valid             200 301 302 60s;
            proxy_cache_valid             404 10s;
            proxy_cache_use_stale         error timeout invalid_header updating
                                          http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_lock              on;
            proxy_cache_lock_timeout      5s;
            proxy_cache_bypass            $cache_bypass;
            proxy_no_cache                $cache_bypass;

            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header X-Content-Type-Options    nosniff always;
            add_header X-Frame-Options           DENY always;
            add_header Referrer-Policy           strict-origin-when-cross-origin always;
            add_header X-XSS-Protection          "1; mode=block" always;
            add_header Cache-Control             "public, max-age=60, stale-while-revalidate=30" always;
            add_header X-Cache-Status            $upstream_cache_status always;
        }
    }
}
